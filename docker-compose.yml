services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ev_charger
      MYSQL_USER: ocpp_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "9093:9093"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ev_charger
      DB_USERNAME: ocpp_app
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in your .env file}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
